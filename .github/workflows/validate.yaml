name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate presets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      # Not pinned, because the hosted Renovate app runs a recent version and a needed migration must fail here
      - run: npx --yes --package renovate -- renovate-config-validator --strict --no-global default.json dashboard.json angular.json nx.json playwright.json react.json renovate.json
